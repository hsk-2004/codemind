apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s

  - name: CodeMind PostgreSQL
    uid: postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: postgres
    secureJsonData:
      password: codemind_dev_password
    jsonData:
      database: codemind
      sslmode: disable
      postgresVersion: 1600
