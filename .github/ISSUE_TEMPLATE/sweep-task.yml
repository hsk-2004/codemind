name: Sweep task
description: Ask the Sweep AI agent to draft a pull request for a small change.
title: "Sweep: "
labels: ["sweep"]
body:
  - type: textarea
    id: task
    attributes:
      label: What should change?
      description: Describe the change in a few sentences. Name the files or functions involved if you know them.
      placeholder: "Sweep: add a unit test for parseGithubUrl with a URL that has a query string"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How do we know it is done?
      description: Behaviour to check, or tests that must pass.
