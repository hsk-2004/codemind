name: AI Review

# Runs CodeMind's own commit-summary and breaking-change analysis on every pull
# request, using a small local model inside the runner (no cloud LLM APIs),
# and posts the result as a PR comment. Advisory only: it never blocks merging.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      SKIP_ENV_VALIDATION: "1"
      OLLAMA_BASE_URL: http://localhost:11434
      # The runner is CPU-only, so CI uses the smallest model from the same family.
      LLM_MODEL: qwen2.5-coder:0.5b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull "$LLM_MODEL"

      - name: Collect PR diff
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" -- . ':(exclude)package-lock.json' > pr.diff
          wc -l pr.diff

      - name: Run AI review
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: npx tsx scripts/ai-pr-review.ts pr.diff "$PR_TITLE" > review.md

      - name: Publish review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat review.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment ${{ github.event.pull_request.number }} --body-file review.md --edit-last \
            || gh pr comment ${{ github.event.pull_request.number }} --body-file review.md
