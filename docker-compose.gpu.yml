# GPU override for the optional Ollama container. Requires the NVIDIA driver and
# NVIDIA Container Toolkit (Docker Desktop with WSL2 on Windows).
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile ollama up --build
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
